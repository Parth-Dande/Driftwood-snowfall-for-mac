name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the universal app
        run: ./build.sh
      - name: Verify the app
        run: |
          codesign --verify --deep --strict --verbose=2 build/Driftwood.app
          lipo -verify_arch arm64 x86_64 build/Driftwood.app/Contents/MacOS/Driftwood
          plutil -lint build/Driftwood.app/Contents/Info.plist
